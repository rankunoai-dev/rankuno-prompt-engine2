[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rankuno-prompt-engine"
version = "0.1.0"
description = "RankUno Prompt Intelligence & Real-Time Autonomous Prompt Tracker"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Rankuno AI Automation Team" }]

# Core runtime dependencies. The core layer must stay importable without any
# vendor SDK installed, so connectors speak plain HTTP through httpx instead of
# pulling in five provider SDKs.
dependencies = [
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "tenacity>=8.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # Executive PDF reports (ADR 0024). Pure-Python wheels on purpose: the
    # runtime image is python:3.11-slim with no system libraries, and the
    # operator develops on Windows. Pillow validates and sizes uploaded logos.
    "reportlab>=4.2",
    "pillow>=10.3",
]
dev = [
    "pypdf>=4.2",  # reads generated PDFs back in tests
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# Lint / format — ruff is the single source of truth for both.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv", "scratch"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "ANN",      # missing annotations — enforces the strict-typing standard
    "S",        # bandit security checks
    "T20",      # no print() — use the structured logger
    "RET", "SIM", "C4",
    "D",        # docstrings
]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "ANN401", # allow typing.Any where genuinely needed (documented at each site)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "D", "ANN"]
"scripts/**" = ["T20"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

# ---------------------------------------------------------------------------
# Type checking — strict on src/, relaxed on tests/.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["^build/", "^dist/", "^\\.venv/"]
# `src` is itself a package (src/__init__.py), so imports read `src.core.x` and
# the import root is the repo root — not `src/`.
mypy_path = "."

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ReportLab ships no type information (ADR 0024). The report renderer is the
# only module that touches it, and it converts everything back to our own
# models before anything else sees it.
[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "src.modules.reporting.pdf"
disallow_subclassing_any = false
disallow_any_unimported = false

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: touches a real external service (skipped in CI by default)",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Governance floor. Raise this as the codebase matures; never lower it.
fail_under = 85
