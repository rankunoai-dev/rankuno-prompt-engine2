<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --page:#f5f3f4; --surface:#fdfcfc; --surface-2:#f0edef; --ink:#171214; --ink-2:#5b5358; --ink-3:#8b838a;
  --line:rgba(23,18,20,.11); --grid:#e5e0e3; --axis:#c9c2c6;
  --accent:#7a2e5e; --accent-ink:#ffffff; --accent-wash:rgba(122,46,94,.09);
  --e-aio:#2a78d6; --e-chatgpt:#eb6834; --e-pplx:#1baf7a; --e-gemini:#4a3aa7;
  --good:#0ca30c; --good-text:#006300; --warn:#fab219; --warn-text:#7a5200; --crit:#d03b3b; --crit-text:#a82323;
  --seq-0:#f0eef0; --seq-1:#cde2fb; --seq-2:#9ec5f4; --seq-3:#6da7ec; --seq-4:#3987e5; --seq-5:#256abf; --seq-6:#184f95; --seq-7:#0d366b;
  --shadow:0 12px 40px rgba(23,18,20,.14);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --rail:232px; --drawer:520px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#121012; --surface:#1b181a; --surface-2:#242022; --ink:#f3eff1; --ink-2:#c2bbbf; --ink-3:#8f878c;
    --line:rgba(255,255,255,.10); --grid:#2c282a; --axis:#3d3739;
    --accent:#d47cb0; --accent-ink:#1b0f16; --accent-wash:rgba(212,124,176,.13);
    --e-aio:#3987e5; --e-chatgpt:#d95926; --e-pplx:#199e70; --e-gemini:#9085e9;
    --good:#0ca30c; --good-text:#3fcf3f; --warn:#fab219; --warn-text:#f2c25c; --crit:#d03b3b; --crit-text:#f07070;
    --seq-0:#242022; --seq-1:#0d366b; --seq-2:#184f95; --seq-3:#256abf; --seq-4:#3987e5; --seq-5:#5598e7; --seq-6:#86b6ef; --seq-7:#b7d3f6;
    --shadow:0 12px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#121012; --surface:#1b181a; --surface-2:#242022; --ink:#f3eff1; --ink-2:#c2bbbf; --ink-3:#8f878c;
  --line:rgba(255,255,255,.10); --grid:#2c282a; --axis:#3d3739;
  --accent:#d47cb0; --accent-ink:#1b0f16; --accent-wash:rgba(212,124,176,.13);
  --e-aio:#3987e5; --e-chatgpt:#d95926; --e-pplx:#199e70; --e-gemini:#9085e9;
  --good:#0ca30c; --good-text:#3fcf3f; --warn:#fab219; --warn-text:#f2c25c; --crit:#d03b3b; --crit-text:#f07070;
  --seq-0:#242022; --seq-1:#0d366b; --seq-2:#184f95; --seq-3:#256abf; --seq-4:#3987e5; --seq-5:#5598e7; --seq-6:#86b6ef; --seq-7:#b7d3f6;
  --shadow:0 12px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- shell ---- */
.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100%}
.rail{position:sticky;top:0;height:100vh;height:100dvh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand .mark{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:600 13px var(--mono)}
.brand h1{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
.brand small{display:block;color:var(--ink-3);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:transparent;text-align:left;color:var(--ink-2)}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-wash);color:var(--accent);font-weight:600}
.nav .count{font:500 11px var(--mono);color:var(--ink-3);background:var(--surface-2);padding:1px 6px;border-radius:999px}
.nav button[aria-current="page"] .count{color:var(--accent)}
.rail-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);font-size:12px;color:var(--ink-2);display:flex;flex-direction:column;gap:8px}
.src{display:flex;align-items:center;gap:8px}
.src .dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.src.live .dot{background:var(--good)}
.rail-foot .kbd{margin-left:auto}
.kbd{font:500 11px var(--mono);color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--surface)}

main{min-width:0;padding:0 28px calc(48px + env(safe-area-inset-bottom,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--page);padding:18px 0 12px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;border-bottom:1px solid var(--line)}
.client{display:flex;flex-direction:column;min-width:0}
.client .eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.client .name{font-size:20px;font-weight:600;letter-spacing:-.01em;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.client .name span{font-size:14px;font-weight:400;color:var(--ink-2)}
.client .doms{font:12px var(--mono);color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px}
.topbar .grow{flex:1}
.asof{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
select,.input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;color:var(--ink)}
select:hover{border-color:var(--ink-3)}
.search-btn{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--ink-3);min-width:220px}
.search-btn:hover{border-color:var(--ink-3);color:var(--ink-2)}
.search-btn span{flex:1;text-align:left}

.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 0 4px}
.filters .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-right:2px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px 4px 8px;font-size:12px;color:var(--ink-2)}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--ink-2)}
.chip[aria-pressed="false"] .sw{opacity:.25}
.sw{width:10px;height:10px;border-radius:3px;background:var(--c,var(--ink-3));flex:none}
.sw.line{height:3px;border-radius:2px;width:14px}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.filters select{padding:4px 8px;font-size:12px;border-radius:999px}
.filters .clear{border:0;background:none;color:var(--accent);font-size:12px;padding:4px 6px}

/* ---- content ---- */
.view{padding-top:18px;display:flex;flex-direction:column;gap:22px}
.view-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
.view-head h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
.view-head p{margin:2px 0 0;color:var(--ink-2);max-width:62ch}
.demo-note{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--ink-2)}
.demo-note b{color:var(--ink)}
.demo-note button{margin-left:auto;flex:none}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:3px 8px;font-size:12px}

.grid{display:grid;gap:14px}
.grid.tiles{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.grid.engines{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.card h3{margin:0 0 2px;font-size:14px;font-weight:600}
.card .sub{margin:0 0 12px;font-size:12px;color:var(--ink-3)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.tile .label{font-size:12px;color:var(--ink-2)}
.tile .value{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin:4px 0 2px}
.tile .value small{font-size:14px;font-weight:400;color:var(--ink-3);margin-left:4px}
.tile .delta{font-size:12px;color:var(--ink-3)}
.delta.up{color:var(--good-text)} .delta.down{color:var(--crit-text)}
.hero{display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:18px;align-items:stretch}
.hero .big{font-size:56px;font-weight:600;letter-spacing:-.03em;line-height:1;margin:6px 0 4px}
.hero .big small{font-size:18px;font-weight:400;color:var(--ink-3);letter-spacing:0}
.hero p{margin:0;color:var(--ink-2);font-size:13px;max-width:34ch}
.stack{display:flex;flex-direction:column;gap:10px}
.eng-card{border-top:3px solid var(--c)}
.eng-card .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--ink-2)}
.eng-card .row b{font-size:20px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.eng-card .mini{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:10px;font-size:12px;color:var(--ink-2)}
.eng-card .mini b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.eng-card svg{display:block;width:100%;height:44px;margin-top:10px}
.eng-card .what{font-size:11px;color:var(--ink-3);margin-top:8px;line-height:1.4}

/* charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--sans);font-size:11px;fill:var(--ink-3)}
.chart .tick{font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-2);margin:0 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;padding:8px 10px;font-size:12px;min-width:150px;z-index:4}
.tip .t{font-weight:600;margin-bottom:4px;color:var(--ink)}
.tip .r{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tip .r b{color:var(--ink);font-weight:600;margin-left:auto}
.tip .k{width:12px;height:3px;border-radius:2px;background:var(--c)}
.hm{display:grid;gap:3px;font-size:12px}
.hm .h{color:var(--ink-3);font-size:11px;text-align:center;padding:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hm .rl{color:var(--ink-2);padding:0 8px 0 0;display:flex;align-items:center;white-space:nowrap}
.hm .c{height:38px;border-radius:5px;display:grid;place-items:center;font-variant-numeric:tabular-nums;font-weight:500;cursor:pointer;border:0;padding:0}
.hm .c:hover{outline:2px solid var(--ink);outline-offset:-2px}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:minmax(120px,190px) 1fr 52px;align-items:center;gap:10px;font-size:12px}
.bar .n{font-family:var(--mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;background:none;border:0;padding:0;color:var(--ink-2)}
.bar .n:hover{color:var(--accent);text-decoration:underline}
.bar .n.client{color:var(--ink);font-weight:500}
.bar .track{height:14px;background:var(--surface-2);border-radius:0 4px 4px 0;overflow:hidden}
.bar .fill{height:100%;background:var(--ink-3);border-radius:0 4px 4px 0}
.bar .fill.client{background:var(--accent)}
.bar .fill.comp{background:var(--ink-2)}
.bar .v{font-variant-numeric:tabular-nums;color:var(--ink-2);text-align:right}
.hist{display:flex;align-items:flex-end;gap:2px;height:80px}
.hist div{flex:1;background:var(--c);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.hist-x{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);margin-top:4px;font-variant-numeric:tabular-nums}

/* tables */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:500;white-space:nowrap;background:var(--surface);position:sticky;top:0}
th button{border:0;background:none;padding:0;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;display:inline-flex;gap:4px;align-items:center}
th button:hover{color:var(--ink)}
th .arrow{font-size:10px}
tbody tr:last-child td{border-bottom:0}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--surface-2)}
tr.row[aria-selected="true"] td{background:var(--accent-wash)}
td.num{font-variant-numeric:tabular-nums;text-align:right}
td.mono{font-family:var(--mono);font-size:12px}
.ptxt{font-weight:500;color:var(--ink);max-width:46ch}
.pmeta{font-size:11px;color:var(--ink-3);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:500;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill.branded{background:var(--accent-wash);color:var(--accent)}
.pill.keep{color:var(--good-text)} .pill.drop{color:var(--crit-text)}
.pill.gap{color:var(--warn-text)}
.pill .i{font-weight:600}
.ecell{display:inline-flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums}
.ring{width:22px;height:22px;border-radius:50%;flex:none;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center}
.ring::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--surface)}
.ecell .rk{font-size:12px;color:var(--ink-2);min-width:30px}
.ecell .rk b{color:var(--ink);font-weight:600}
.ecell.na{color:var(--ink-3);font-size:12px}
.ecell2{display:inline-flex;flex-direction:column;gap:3px;font-variant-numeric:tabular-nums;font-size:12px;line-height:1.3}
.ecell2 .ecl{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sub-th{display:block;font-size:10px;font-weight:400;color:var(--ink-3);text-transform:none;letter-spacing:.02em;margin-top:2px}
.ecell2 .ecl b{color:var(--ink);font-weight:600;min-width:34px}
.ecell2 .ecl .ring{width:16px;height:16px}
.ecell2 .ecl .ring::after{width:10px;height:10px}
.ecell2 .ecl.mention .ring{filter:saturate(.45) brightness(1.08)}
.group-h td{background:var(--surface-2);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);font-weight:600;padding:6px 12px}
.url{font-family:var(--mono);font-size:12px;color:var(--ink-2);max-width:32ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.empty{padding:36px;text-align:center;color:var(--ink-3)}

/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(var(--drawer),100vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:20;transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer.open{transform:none}
.drawer-head{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line)}
.drawer-head .id{font:12px var(--mono);color:var(--ink-3);flex:1}
.drawer-body{overflow:auto;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.drawer h2{margin:0;font-size:18px;font-weight:600;line-height:1.3;letter-spacing:-.01em;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;color:var(--ink)}
.verdict{border-radius:10px;padding:10px 12px;font-size:13px;background:var(--surface-2)}
.verdict.keep{border-left:3px solid var(--good)} .verdict.drop{border-left:3px solid var(--crit)}
.verdict b{display:block;margin-bottom:2px}
.gapbox{border-radius:10px;padding:10px 12px;font-size:13px;background:var(--surface-2);border-left:3px solid var(--warn)}
.gapbox code{font-family:var(--mono);font-size:12px}
.es{border:1px solid var(--line);border-radius:10px;padding:12px 14px;border-top:3px solid var(--c)}
.es-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.es-head h4{margin:0;font-size:13px;font-weight:600;flex:1}
.es-head .model{font:11px var(--mono);color:var(--ink-3)}
.es .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.es .stats div{font-size:11px;color:var(--ink-3)}
.es .stats b{display:block;font-size:16px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.es svg{display:block;width:100%;height:56px}
.es .doms{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.dom{font:12px var(--mono);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--surface);color:var(--ink-2);cursor:pointer}
.dom:hover{border-color:var(--accent);color:var(--accent)}
.dom.client{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dom.comp{border-color:var(--ink-3);color:var(--ink)}
.dom .rk{opacity:.7;margin-left:4px}
.excerpt{font-size:12px;color:var(--ink-2);margin:8px 0 0;line-height:1.5;border-left:2px solid var(--line);padding-left:10px}
.vel{font-size:12px;color:var(--ink-2);margin-top:6px}
.drawer-nav{display:flex;gap:6px}

/* palette */
.pal-back{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:none}
.pal-back.open{display:block}
.pal{position:absolute;left:50%;top:12vh;transform:translateX(-50%);width:min(640px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:14px 16px;font-size:15px;outline:none}
.pal ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.pal li{padding:8px 10px;border-radius:8px;display:flex;gap:10px;align-items:center;cursor:pointer;font-size:13px}
.pal li[aria-selected="true"],.pal li:hover{background:var(--accent-wash)}
.pal li .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);min-width:56px}
.pal li .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* data view */
.drop{border:1.5px dashed var(--ink-3);border-radius:12px;padding:28px;text-align:center;color:var(--ink-2);background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-wash)}
textarea{width:100%;min-height:120px;font:12px var(--mono);border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--ink);resize:vertical}
.fmt{font-size:13px;color:var(--ink-2)}

/* =========================== demo data =========================== */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function buildDemo(){

    ['How much does source-to-pay software cost per year?','NON_BRANDED','DECISION','TRANSACTIONAL','Pricing','source to pay software pricing',720,0.18,5],

    ['Is GEP a good choice for procurement software?','BRANDED','AWARENESS','INFORMATIONAL','GEP Reputation','gep procurement software',720,0.66,null],
    ['What are the key features of GEP SMART for source-to-pay?','BRANDED','CONSIDERATION','COMMERCIAL','Source-to-Pay','gep smart features',540,0.78,0],
    ['GEP SMART vs Coupa: which is better for spend analysis?','BRANDED','CONSIDERATION','COMMERCIAL','Spend Analysis','gep smart vs coupa',430,0.58,2],
    ['Does GEP SMART integrate with Oracle and SAP ERPs?','BRANDED','CONSIDERATION','COMMERCIAL','ERP Integration','gep smart integrations',260,0.62,null],
    ['How much does GEP SMART cost and how is it priced?','BRANDED','DECISION','TRANSACTIONAL','Pricing','gep smart pricing',880,0.55,5],
    ['What do customers say about GEP SMART in reviews?','BRANDED','DECISION','COMMERCIAL','GEP Reviews','gep smart reviews',390,0.44,null],
    ['Can GEP SMART handle supplier management and risk scoring?','BRANDED','DECISION','COMMERCIAL','Supplier Management','gep supplier management',210,0.70,3],

    ['Where is the GEP SMART user guide and training documentation?','BRANDED','POST_PURCHASE','NAVIGATIONAL','GEP SMART Support','gep smart user guide',320,0.80,null],

  });

/* =========================== ingestion =========================== */
function normaliseDataset(raw, sourceLabel){
  // 1. Exporter JSON {prompts, snapshots, runs, meta}
  if (raw && Array.isArray(raw.prompts) && Array.isArray(raw.snapshots)){
    const meta = Object.assign({brand_name:'', lob:'', aliases:[], domains:[], competitor_domains:[]}, raw.meta||{});
    const runs = (raw.runs||[]).map(r => Object.assign({warnings:[]}, r));
    if (!meta.brand_name && runs.length) meta.brand_name = runs[runs.length-1].brand_name;
    if (!meta.lob && runs.length) meta.lob = runs[runs.length-1].lob;
    if (!meta.lob && raw.prompts.length) meta.lob = raw.prompts[0].lob;
    const prompts = raw.prompts.map(p => Object.assign({content_gap: !p.mapped_url, verdict:null, verdict_reason:null, web_triggers:null}, p));
    meta.source = meta.source || 'export'; meta.label = sourceLabel; meta.loaded_at = new Date().toISOString();
    return {meta, prompts, snapshots: raw.snapshots.map(fixSnap), runs};
  }
  // 2. CLI --json (ToolResult wrapping TrackerRunSummary) or a bare summary
  const summary = raw && raw.data && Array.isArray(raw.data.records) ? raw.data : (raw && Array.isArray(raw.records) ? raw : null);
  if (summary){
    const run = {run_id:summary.run_id, lob:summary.lob, brand_name:summary.brand_name, started_at:summary.started_at, finished_at:summary.finished_at, prompts_selected:summary.prompts_selected, engine_calls:summary.engine_calls, failed_engine_calls:summary.failed_engine_calls, estimated_cost_usd:summary.estimated_cost_usd, semrush_units:summary.semrush_units, report_path:summary.report_path, warnings:summary.warnings||[]};
    const prompts=[], snapshots=[];
    summary.records.forEach(r => {
      const {citation_history, ...p} = r; prompts.push(p);
      (citation_history||[]).forEach(sn => snapshots.push(fixSnap(Object.assign({prompt_id:r.prompt_id, run_id:run.run_id}, sn))));
    });
    const domains = [...new Set(prompts.map(p => (p.mapped_url? regDomain(p.mapped_url):null)).filter(Boolean))];
    return {meta:{brand_name:summary.brand_name, lob:summary.lob, aliases:[], domains, competitor_domains:[], source:'cli', label:sourceLabel, loaded_at:new Date().toISOString()}, prompts, snapshots, runs:[run]};
  }
  throw new Error('Unrecognised JSON. Expected the CLI --json output (a ToolResult with data.records) or an export with prompts, snapshots and runs arrays.');
}
function fixSnap(sn){
  const o = Object.assign({}, sn);
  o.client_cited = !!(o.client_cited===true || o.client_cited===1);
  if (typeof o.cited_domains==='string'){ try{ o.cited_domains=JSON.parse(o.cited_domains);}catch(e){ o.cited_domains=[]; } }
  if (typeof o.competitor_citations==='string'){ try{ o.competitor_citations=JSON.parse(o.competitor_citations);}catch(e){ o.competitor_citations={}; } }
  o.cited_domains = o.cited_domains||[]; o.competitor_citations = o.competitor_citations||{};
  o.mention_rate = typeof o.mention_rate==='number' ? o.mention_rate : 0;
  if (typeof o.mention_snippets==='string'){ try{ o.mention_snippets=JSON.parse(o.mention_snippets);}catch(e){ o.mention_snippets=[]; } }
  o.mention_snippets = o.mention_snippets||[];
  return o;
}
function parseCSV(text){
  const rows=[]; let row=[], field='', q=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (q){ if (c==='"'){ if (text[i+1]==='"'){ field+='"'; i++; } else q=false; } else field+=c; }
    else if (c==='"') q=true;
    else if (c===','){ row.push(field); field=''; }
    else if (c==='\n' || c==='\r'){ if (c==='\r' && text[i+1]==='\n') i++; row.push(field); rows.push(row); row=[]; field=''; }
    else field+=c;
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length>1 || (r.length===1 && r[0].trim()));
}
function datasetFromCSV(text, sourceLabel){
  const rows = parseCSV(text);
  if (rows.length<2) throw new Error('CSV has no data rows.');
  const hdr = rows[0].map(x=>x.trim());
  const col = name => hdr.indexOf(name);
  const need = ['Prompt ID','LOB','Prompt'];
  need.forEach(n => { if (col(n)<0) throw new Error(`CSV is missing the "${n}" column, so it is not a master sheet.`); });
  const now = new Date().toISOString();
  const runId = fnv16('csv'+now);
  const prompts=[], snapshots=[];
  const up = v => String(v||'').trim().toUpperCase().replace(/-/g,'_');
  rows.slice(1).forEach(r => {
    const g = n => { const i=col(n); return i>=0 ? (r[i]||'').trim() : ''; };
    const mapped = g('Mapped URL');
    const gap = /^\[CONTENT GAP/i.test(mapped);
    const pid = g('Prompt ID');
    prompts.push({prompt_id:pid, lob:g('LOB'), subtopic:g('Subtopic')||'—', core_keyword:g('Core Keyword')||'—', search_volume:parseInt(g('Search Volume'),10)||0, prompt_text:g('Prompt'), search_intent:up(g('Search Intent'))||'INFORMATIONAL', decision_stage:up(g('Decision Stage'))||'AWARENESS', prompt_type:up(g('Prompt Type'))||'NON_BRANDED', web_triggers:g('Web Triggers').toLowerCase()==='yes', mapped_url: gap? null : (mapped||null), content_gap:gap, verdict:up(g('Verdict'))||null, verdict_reason:g('Verdict Reason')||null, created_at:now});
    const allDoms = g('Cited Domains').split(',').map(x=>x.trim()).filter(Boolean);
    const compByEngine = {};
    g('Competitor Citations').split(';').map(x=>x.trim()).filter(Boolean).forEach(item => {
      const m = item.match(/^(.+?):\s*(\S+)\s*#(\d+)$/); if (!m) return;
      const eid = CSV_LABELS[m[1].trim()]; if (!eid) return;
      (compByEngine[eid] = compByEngine[eid]||{})[m[2]] = parseInt(m[3],10);
    });
    Object.entries(CSV_LABELS).forEach(([label,eid]) => {

  const br = arr => { const r = arr.map(x=>x.client_best_rank).filter(x=>x!=null); return r.length? Math.min(...r):null; };

function sparkline(values, color, opts={}){
  const W=opts.w||320, H=opts.h||44, pad=4;
  const n=values.length;
  const svg = s('svg',{viewBox:`0 0 ${W} ${H}`, 'aria-hidden':'true'});
  if (!n) return svg;
  const x = i => n===1 ? W/2 : pad + i*(W-2*pad)/(n-1);
  const y = v => H-pad - (v==null?0:v)*(H-2*pad);
  const pts = values.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  svg.append(s('path',{d:`M${pts[0]} L${pts.slice(1).join(' L')} L${x(n-1).toFixed(1)},${H-pad} L${x(0).toFixed(1)},${H-pad} Z`, fill:color, 'fill-opacity':'0.1'}));
  svg.append(s('path',{d:'M'+pts.join(' L'), fill:'none', stroke:color, 'stroke-width':'2', 'stroke-linejoin':'round', 'stroke-linecap':'round', 'vector-effect':'non-scaling-stroke'}));
  svg.append(s('circle',{cx:x(n-1), cy:y(values[n-1]), r:'4', fill:color, stroke:'var(--surface)', 'stroke-width':'2', 'vector-effect':'non-scaling-stroke'}));
  return svg;
}
function lineChart(container, series, xs, opts={}){
  // series: [{id,label,color,values[]}], xs: ISO dates
  const W=720, H=opts.h||220, m={t:12,r:16,b:28,l:36};
  const iw=W-m.l-m.r, ih=H-m.t-m.b, n=xs.length;
  const wrap = h('div',{class:'chart'});
  const svg = s('svg',{viewBox:`0 0 ${W} ${H}`, role:'img', 'aria-label':opts.label||'Line chart'});
  const x = i => n===1 ? m.l+iw/2 : m.l + i*iw/(n-1);
  const y = v => m.t + ih - v*ih;
  [0,0.25,0.5,0.75,1].forEach(t => {
    svg.append(s('line',{x1:m.l, x2:W-m.r, y1:y(t), y2:y(t), stroke: t===0?'var(--axis)':'var(--grid)', 'stroke-width':'1'}));
    svg.append(s('text',{x:m.l-6, y:y(t)+4, 'text-anchor':'end', class:'tick'}, Math.round(t*100)+'%'));
  });
  const step = Math.max(1, Math.ceil(n/8));
  xs.forEach((d,i)=>{ if (i%step===0 || i===n-1) svg.append(s('text',{x:x(i), y:H-8, 'text-anchor': i===n-1?'end':(i===0?'start':'middle'), class:'tick'}, fmtDate(d))); });
  series.forEach(se => {
    const pts = se.values.map((v,i)=> v==null?null:`${x(i).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean);
    if (!pts.length) return;
    svg.append(s('path',{d:'M'+pts.join(' L'), fill:'none', stroke:se.color, 'stroke-width':'2', 'stroke-linejoin':'round', 'stroke-linecap':'round'}));
    const li = se.values.length-1;
    if (se.values[li]!=null) svg.append(s('circle',{cx:x(li), cy:y(se.values[li]), r:'4', fill:se.color, stroke:'var(--surface)', 'stroke-width':'2'}));
  });
  const cross = s('line',{x1:0,x2:0,y1:m.t,y2:m.t+ih, stroke:'var(--ink-3)', 'stroke-width':'1', visibility:'hidden'});
  svg.append(cross);
  const tip = h('div',{class:'tip', hidden:true});
  wrap.append(svg, tip);
  const move = ev => {
    const r = svg.getBoundingClientRect(); const px = (ev.clientX - r.left) * W / r.width;
    let i = Math.round((px - m.l)/(iw/Math.max(1,n-1))); i = Math.max(0, Math.min(n-1, i));
    cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.setAttribute('visibility','visible');
    tip.hidden=false; tip.replaceChildren(h('div',{class:'t'}, opts.xLabel ? opts.xLabel(xs[i], i) : fmtDate(xs[i])), ...series.map(se => h('div',{class:'r'}, h('span',{class:'k', style:`--c:${se.color}`}), se.label, h('b',null, pct(se.values[i])))));

/* =========================== command palette =========================== */
function paletteItems(q){
  const s2 = q.trim().toLowerCase(); const out=[];
  VIEWS.forEach(v => { if (!s2 || v.label.toLowerCase().includes(s2)) out.push({k:'View', t:v.label, run:()=>go(v.id)}); });
  ENGINES.forEach(e => { if (s2 && e.label.toLowerCase().includes(s2)) out.push({k:'Engine', t:e.label, run:()=>go('engines', e.id)}); });
  if (s2){
    state.data.prompts.forEach(p => { if (p.prompt_text.toLowerCase().includes(s2) || p.subtopic.toLowerCase().includes(s2) || p.core_keyword.toLowerCase().includes(s2) || p.prompt_id.startsWith(s2)) out.push({k:'Prompt', t:p.prompt_text, run:()=>{ if (state.view!=='prompts') go('prompts'); openDrawer(p.prompt_id); }}); });
    const {counts} = domainCounts(state.data.prompts, ENGINES);
    [...counts.keys()].filter(dm=>dm.includes(s2)).slice(0,8).forEach(dm => out.push({k:'Domain', t:dm, run:()=>go('voice', dm)}));
    const subs = [...new Set(state.data.prompts.map(p=>p.subtopic))].filter(x=>x.toLowerCase().includes(s2));
    subs.forEach(sb => out.push({k:'Subtopic', t:sb, run:()=>{ state.q=sb; go('prompts'); }}));
    out.push({k:'Search', t:`Filter prompt sheet by “${q.trim()}”`, run:()=>{ state.q=q.trim(); go('prompts'); }});
  }
  return out.slice(0,14);
}

function renderPalette(){
  const items = paletteItems($('#pal-input').value); const ul = $('#pal-list'); ul.replaceChildren();
  items.forEach((it,i) => ul.append(h('li',{role:'option', 'aria-selected': i===palSel?'true':'false', onclick:()=>{ closePalette(); it.run(); }, onmousemove:()=>{ palSel=i; [...ul.children].forEach((li,j)=>li.setAttribute('aria-selected', j===i?'true':'false')); }}, h('span',{class:'k'}, it.k), h('span',{class:'t'}, it.t))));
  ul._items = items;
}

/* =========================== boot =========================== */
function applyHash(){
  const hsh = decodeURIComponent(location.hash.slice(1)); if (!hsh) return;
  const [view, param] = hsh.split('/');
  if (view==='prompt' && param){ state.drawer=param; return; }
  if (VIEWS.some(v=>v.id===view)){ state.view=view; state.param=param||null; if (view==='engines' && param) state.engineTab=param; }
}
loadInitial(); applyHash(); render();
window.addEventListener('hashchange', ()=>{ applyHash(); render(); });
$('#dr-close').onclick = closeDrawer;
$('#open-pal').onclick = openPalette;
$('#pal-back').addEventListener('click', ev => { if (ev.target.id==='pal-back') closePalette(); });
$('#pal-input').addEventListener('input', ()=>{ palSel=0; renderPalette(); });
$('#pal-input').addEventListener('keydown', ev => { const items=$('#pal-list')._items||[]; if (ev.key==='ArrowDown'){ palSel=Math.min(items.length-1,palSel+1); renderPalette(); ev.preventDefault(); } else if (ev.key==='ArrowUp'){ palSel=Math.max(0,palSel-1); renderPalette(); ev.preventDefault(); } else if (ev.key==='Enter'){ const it=items[palSel]; if (it){ closePalette(); it.run(); } } else if (ev.key==='Escape') closePalette(); });
document.addEventListener('keydown', ev => {
  if ((ev.ctrlKey||ev.metaKey) && ev.key.toLowerCase()==='k'){ ev.preventDefault(); openPalette(); return; }
  if (ev.key==='Escape'){ if ($('#pal-back').classList.contains('open')) closePalette(); else if (state.drawer) closeDrawer(); }
  if (state.drawer && !$('#pal-back').classList.contains('open') && (ev.target===document.body || ev.target.closest('#drawer'))){ if (ev.key==='ArrowDown'){ $('#dr-next').click(); ev.preventDefault(); } if (ev.key==='ArrowUp'){ $('#dr-prev').click(); ev.preventDefault(); } }
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
})();
</script>
