name: CI

# SDLC Step 7 (Automated Verification) enforced in CI. Mirrors
# scripts/verify.ps1 exactly - if this diverges, fix it in the same commit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, type check, test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check --output-format=github .

      - name: Type check (strict)
        run: mypy src

      - name: Tests
        # No credentials are exposed to this job. Any test that needs an
        # external service must mock it; genuinely networked tests are marked
        # `integration` and excluded here.
        run: pytest --cov=src --cov-report=term-missing -m "not integration"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if a .env file was committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked in git. Remove it and rotate every credential it contained."
            exit 1
          fi
          echo "No tracked .env file."

      - name: Fail on committed service-account keys
        run: |
          matches=$(git ls-files | grep -E '(service[-_]account.*\.json|credentials\.json|.*\.pem)$' || true)
          if [ -n "$matches" ]; then
            echo "::error::Possible credential files committed:"
            echo "$matches"
            exit 1
          fi
          echo "No credential files found."
